<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL SYSTEM V69</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        :root { --bg: #010409; --panel: #0d1117; --border: #30363d; --text: #e6edf3; --accent: #238636; --danger: #da3633; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
        h3 { font-size: 14px; margin: 0 0 15px 0; color: #8b949e; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        input { width: 100%; padding: 10px; margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: #2f81f7; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .btn-main { background: var(--accent); color: #fff; }
        .btn-refresh { background: #21262d; color: #c9d1d9; border: 1px solid var(--border); width: auto; padding: 5px 15px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: #8b949e; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
        
        #qr-canvas-box { margin-top: 20px; text-align: center; background: #fff; padding: 10px; border-radius: 4px; display: none; }
        #qr-canvas-box canvas { width: 160px !important; }
        
        .btn-del { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; font-size: 11px; }
        .btn-del:hover { background: var(--danger); color: #fff; }
        #log { font-family: monospace; font-size: 11px; color: #7d8590; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 10px; }
    </style>
</head>
<body>

<div class="grid">
    <div class="panel">
        <h3>Input Data</h3>
        <input type="text" id="pName" placeholder="Full Name">
        <input type="text" id="pFlight" placeholder="Flight ID">
        <button class="btn-main" onclick="pushData()">REGISTER & SYNC</button>
        
        <div id="qr-canvas-box"></div>
        <div id="log">Status: Standby</div>
    </div>

    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>Active Database</h3>
            <button class="btn-refresh" onclick="syncList()">FORCE SYNC</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>UID</th>
                    <th>Passenger</th>
                    <th>Flight</th>
                    <th>Manage</th>
                </tr>
            </thead>
            <tbody id="data-table"></tbody>
        </table>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        token: "ВСТАВЬ_СВОЙ_ТОКЕН_ЗДЕСЬ",
        repo: "ТВОЙ_НИК/ТВОЙ_РЕПО",
        path: "database.json"
    };

    function setLog(m) { document.getElementById('log').innerText = `> ${m}`; }

    async function apiReq(method, body = null, sha = null) {
        const url = `https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.path}`;
        const headers = { Authorization: `token ${CONFIG.token}`, "Content-Type": "application/json" };
        const payload = body ? { message: "update", content: btoa(JSON.stringify(body, null, 2)), sha } : null;
        
        const res = await fetch(url, { method, headers, body: payload ? JSON.stringify(payload) : null });
        return res.json();
    }

    async function syncList() {
        setLog("Syncing...");
        const data = await apiReq("GET");
        const list = JSON.parse(atob(data.content));
        const tbody = document.getElementById('data-table');
        tbody.innerHTML = "";
        
        list.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td><code>${item.id}</code></td>
                    <td>${item.name}</td>
                    <td>${item.flight}</td>
                    <td><button class="btn-del" onclick="removeData('${item.id}')">VOID</button></td>
                </tr>`;
        });
        setLog(`Ready. Records: ${list.length}`);
        return { list, sha: data.sha };
    }

    async function pushData() {
        const name = document.getElementById('pName').value;
        const flight = document.getElementById('pFlight').value;
        if (!name || !flight) return;

        setLog("Processing...");
        const { list, sha } = await syncList();
        const id = Math.random().toString(36).substr(2, 6).toUpperCase();
        
        list.push({ id, name, flight });
        await apiReq("PUT", list, sha);
        
        const box = document.getElementById('qr-canvas-box');
        box.style.display = 'block';
        box.innerHTML = "";
        QRCode.toCanvas(document.createElement('canvas'), id, { width: 160 }, (e, cvs) => box.appendChild(cvs));
        
        syncList();
    }

    async function removeData(id) {
        setLog(`Voiding ${id}...`);
        const { list, sha } = await syncList();
        const filtered = list.filter(t => t.id !== id);
        await apiReq("PUT", filtered, sha);
        syncList();
    }

    syncList();
</script>
</body>
</html>
