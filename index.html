<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BANK SYSTEM v3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff41; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; }
        .block { background: #111; border: 2px solid #00ff41; padding: 20px; border-radius: 10px; width: 320px; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
        h2 { text-align: center; font-size: 1.2em; border-bottom: 1px solid #00ff41; padding-bottom: 10px; }
        button { width: 100%; padding: 12px; margin: 5px 0; background: #00ff41; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        button:hover { background: #008f11; color: white; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #00ff41; color: #00ff41; box-sizing: border-box; }
        .screen { background: #002200; padding: 15px; border-radius: 5px; min-height: 50px; margin-bottom: 10px; border: 1px inset #00ff41; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="block">
        <h2>[ KASSA_STATION ]</h2>
        <div class="screen" id="k-disp">ВЫБЕРИТЕ ТОВАР</div>
        <button onclick="add('BURGER', 500)">+ BURGER (500)</button>
        <button onclick="add('SODA', 150)">+ SODA (150)</button>
        <button onclick="send()" style="background: #ffaa00">ОТПРАВИТЬ НА ТЕРМИНАЛ</button>
    </div>

    <div class="block">
        <h2>[ TERMINAL_01 ]</h2>
        <div class="screen" id="t-disp">ОЖИДАНИЕ...</div>
        <div id="t-ui" style="display:none">
            <input type="text" id="t-card" placeholder="НОМЕР КАРТЫ">
            <input type="password" id="t-pin" placeholder="PIN-КОД">
            <button onclick="pay()">ПОДТВЕРДИТЬ ОПЛАТУ</button>
        </div>
    </div>

    <div class="block">
        <h2>[ ADMIN_PANEL ]</h2>
        <div class="screen">РЕГИСТРАЦИЯ КЛИЕНТА</div>
        <input type="text" id="a-card" placeholder="НОВЫЙ НОМЕР">
        <input type="text" id="a-pin" placeholder="НОВЫЙ PIN">
        <input type="number" id="a-bal" placeholder="БАЛАНС">
        <button onclick="reg()" style="background: #0088ff">СОЗДАТЬ КАРТУ</button>
    </div>

    <script>
        // === КОНФИГУРАЦИЯ (ВСТАВЬ СВОЕ) ===
        const S_URL = 'https://shswkhgwrxsulqqczbjj.supabase.co';
        const S_KEY = 'ТВОЙ_ANON_KEY_ТУТ'; // Тот самый sb_publishable...
        const sb = supabase.createClient(S_URL, S_KEY);
        
        let sum = 0;
        const TID = '1234';

        // КАССА
        function add(n, p) { sum += p; document.getElementById('k-disp').innerText = `ЗАКАЗ: ${n}\nИТОГО: ${sum} ₽`; }
        async function send() {
            await sb.from('sessions').upsert({ id: TID, total: sum, status: 'paying' });
            document.getElementById('k-disp').innerText = "ОЖИДАНИЕ ОПЛАТЫ...";
        }

        // ТЕРМИНАЛ (Слушает базу)
        sb.channel('pos').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions', filter: `id=eq.${TID}` }, (p) => {
            if(p.new.status === 'paying') {
                document.getElementById('t-disp').innerText = "К ОПЛАТЕ: " + p.new.total + " ₽";
                document.getElementById('t-ui').style.display = 'block';
            }
            if(p.new.status === 'success') {
                document.getElementById('t-disp').innerText = "ОПЛАЧЕНО УСПЕШНО";
                document.getElementById('t-ui').style.display = 'none';
                sum = 0;
            }
        }).subscribe();

        async function pay() {
            const card = document.getElementById('t-card').value;
            const pin = document.getElementById('t-pin').value;
            const { data: dbCard } = await sb.from('bank').select('*').eq('card_num', card).single();
            const { data: sess } = await sb.from('sessions').select('total').eq('id', TID).single();

            if(dbCard && dbCard.pin === pin && dbCard.balance >= sess.total) {
                await sb.from('bank').update({ balance: dbCard.balance - sess.total }).eq('card_num', card);
                await sb.from('sessions').update({ status: 'success' }).eq('id', TID);
            } else { alert("ОТКАЗ В ОПЛАТЕ!"); }
        }

        // АДМИНКА
        async function reg() {
            const n = document.getElementById('a-card').value;
            const p = document.getElementById('a-pin').value;
            const b = document.getElementById('a-bal').value;
            await sb.from('bank').insert({ card_num: n, pin: p, balance: b });
            alert("КАРТА СОЗДАНА!");
        }
    </script>
</body>
</html>
