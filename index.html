<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Digital | Premium Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-card { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        @keyframes pulse-custom { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading { animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black tracking-tighter italic">AURA <span class="text-purple-500">DIGITAL</span></h1>
            <div id="user-avatar" class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center font-bold">M</div>
        </header>

        <div class="gradient-card rounded-3xl p-6 mb-8 shadow-2xl shadow-purple-500/20 transform hover:scale-105 transition">
            <div class="flex justify-between mb-10">
                <span class="text-xs font-mono opacity-80 uppercase tracking-widest">Aura Infinite</span>
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" class="h-6">
            </div>
            <div class="text-xl mb-6 font-mono tracking-widest" id="display-card">**** **** **** 7777</div>
            <div class="flex justify-between items-end">
                <div>
                    <p class="text-xs opacity-60 mb-1">Баланс</p>
                    <p class="text-3xl font-bold" id="balance">0.00 💎</p>
                </div>
                <div class="text-right">
                    <p class="text-xs opacity-60">Имя</p>
                    <p class="font-medium" id="display-name">User Name</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="bank.work()" class="glass rounded-2xl p-4 flex flex-col items-center hover:bg-white/10">
                <span class="text-2xl mb-2">⛏️</span>
                <span class="text-sm font-medium">Работа</span>
            </button>
            <button onclick="bank.openTransfer()" class="glass rounded-2xl p-4 flex flex-col items-center hover:bg-white/10">
                <span class="text-2xl mb-2">💸</span>
                <span class="text-sm font-medium">Перевод</span>
            </button>
        </div>

        <div class="glass rounded-3xl p-6">
            <h3 class="text-lg font-bold mb-4">История</h3>
            <div id="history" class="space-y-4 max-h-60 overflow-y-auto pr-2">
                </div>
        </div>
    </div>

    <script>
        const bank = {
            data: JSON.parse(localStorage.getItem('aura_bank')) || { name: 'Матвей', balance: 5000, card: '4400 8821 9901 7777', history: [] },
            save() { localStorage.setItem('aura_bank', JSON.stringify(this.data)); this.render(); },
            render() {
                document.getElementById('balance').innerText = this.data.balance.toLocaleString() + ' 💎';
                document.getElementById('display-name').innerText = this.data.name;
                document.getElementById('display-card').innerText = this.data.card;
                const hist = document.getElementById('history');
                hist.innerHTML = this.data.history.map(h => `
                    <div class="flex justify-between items-center border-b border-white/5 pb-2">
                        <div>
                            <p class="text-sm font-medium">${h.type}</p>
                            <p class="text-[10px] opacity-40">${h.date}</p>
                        </div>
                        <p class="text-sm ${h.amount > 0 ? 'text-green-400' : 'text-red-400'}">${h.amount > 0 ? '+' : ''}${h.amount}</p>
                    </div>
                `).reverse().join('');
            },
            work() {
                const r = 250; this.data.balance += r;
                this.data.history.push({type: 'Зарплата', amount: r, date: new Date().toLocaleTimeString()});
                this.save();
            },
            openTransfer() {
                const user = prompt("Никнейм или номер карты:");
                const sum = parseInt(prompt("Сумма:"));
                if(sum > 0 && sum <= this.data.balance) {
                    this.data.balance -= sum;
                    this.data.history.push({type: `Перевод (${user})`, amount: -sum, date: new Date().toLocaleTimeString()});
                    this.save();
                }
            }
        };
        bank.render();
    </script>
</body>
</html>
