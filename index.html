<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Ecosystem | Bank & Messenger</title>
    <style>
        :root {
            --accent: #7000ff;
            --accent-light: #b300ff;
            --bg: #050505;
            --card: #121212;
            --text: #ffffff;
            --gray: #888;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; display: flex; justify-content: center; overflow-x: hidden;
        }

        .app-container { width: 100%; max-width: 450px; padding: 20px; min-height: 100vh; position: relative; }

        /* Анимации */
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate { animation: slideUp 0.5s ease forwards; }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Карта Банка */
        .bank-card {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            padding: 25px; border-radius: 20px; margin: 20px 0;
            box-shadow: 0 10px 30px rgba(112, 0, 255, 0.4);
            position: relative; overflow: hidden;
        }
        .bank-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }

        /* Кнопки и инпуты */
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333;
            background: #1a1a1a; color: white; margin-bottom: 15px; outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--accent); color: white; font-weight: bold; cursor: pointer;
        }
        button:active { transform: scale(0.95); }

        /* Меню навигации */
        .nav-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 450px; background: rgba(18,18,18,0.9);
            backdrop-filter: blur(10px); display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid #333;
        }
        .nav-item { cursor: pointer; color: var(--gray); font-size: 12px; text-align: center; }
        .nav-item.active { color: var(--accent); }

        /* Магазин и Чат */
        .item-list, .chat-box { background: var(--card); border-radius: 15px; padding: 15px; margin-top: 15px; }
        .gift-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px; border-bottom: 1px solid #222; 
        }
        .message { 
            padding: 10px; border-radius: 10px; margin-bottom: 10px; max-width: 80%;
            background: #222; align-self: flex-start;
        }
        .message.mine { background: var(--accent); align-self: flex-end; margin-left: auto; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="screen-auth" class="screen active animate">
        <h2 style="text-align: center; margin-top: 50px;">AURA SYSTEM</h2>
        <p style="text-align: center; color: var(--gray);">Войдите в свою экосистему</p>
        <input type="text" id="auth-username" placeholder="Придумайте никнейм">
        <button onclick="app.register()">СОЗДАТЬ АККАУНТ</button>
    </div>

    <div id="screen-bank" class="screen animate">
        <h3>Мои Финансы</h3>
        <div class="bank-card">
            <div style="font-size: 12px; opacity: 0.8;">AURA BLACK CARD</div>
            <div id="card-num" style="margin: 15px 0; font-size: 18px; letter-spacing: 2px;">0000 0000 0000 0000</div>
            <div id="bank-balance" style="font-size: 28px; font-weight: bold;">0 💎</div>
        </div>
        
        <div class="item-list">
            <h4>🔄 Перевод</h4>
            <input type="text" id="transfer-to" placeholder="Никнейм получателя">
            <input type="number" id="transfer-amount" placeholder="Сумма">
            <button onclick="app.sendMoney()">ОТПРАВИТЬ</button>
        </div>

        <div class="item-list">
            <h4>🎁 Магазин Подарков</h4>
            <div class="gift-item"><span>🌟 VIP Статус</span> <b>1000 💎</b> <button onclick="app.buyGift('VIP', 1000)" style="width: auto; padding: 5px 10px;">Купить</button></div>
            <div class="gift-item"><span>👑 Корона</span> <b>5000 💎</b> <button onclick="app.buyGift('Корона', 5000)" style="width: auto; padding: 5px 10px;">Купить</button></div>
        </div>
    </div>

    <div id="screen-chat" class="screen animate">
        <h3>Aura Connect</h3>
        <div id="chat-messages" class="chat-box" style="height: 300px; overflow-y: auto; display: flex; flex-direction: column;">
            </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="text" id="chat-input" placeholder="Сообщение..." style="margin: 0;">
            <button onclick="app.sendMessage()" style="width: 80px;">-></button>
        </div>
        <div id="my-inventory" style="margin-top: 15px; font-size: 12px; color: var(--gray);"></div>
    </div>

    <div id="main-nav" class="nav-bar" style="display: none;">
        <div class="nav-item active" onclick="app.showScreen('bank', this)">🏦 Банк</div>
        <div class="nav-item" onclick="app.showScreen('chat', this)">💬 Чаты</div>
        <div class="nav-item" onclick="app.work()">⛏ Работа</div>
    </div>
</div>

<script>
    const app = {
        db: JSON.parse(localStorage.getItem('aura_db')) || { users: {} },
        currentUser: null,

        save() { localStorage.setItem('aura_db', JSON.stringify(this.db)); },

        register() {
            const name = document.getElementById('auth-username').value.trim();
            if (!name) return alert("Введите ник!");
            
            if (!this.db.users[name]) {
                this.db.users[name] = {
                    balance: 1000,
                    card: `4400 ${Math.floor(1000+Math.random()*9000)} ${Math.floor(1000+Math.random()*9000)} 7777`,
                    inventory: [],
                    messages: []
                };
            }
            this.currentUser = name;
            this.save();
            document.getElementById('main-nav').style.display = 'flex';
            this.showScreen('bank', document.querySelector('.nav-item'));
            this.updateUI();
        },

        showScreen(scr, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${scr}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            this.updateUI();
        },

        updateUI() {
            const user = this.db.users[this.currentUser];
            document.getElementById('bank-balance').innerText = `${user.balance} 💎`;
            document.getElementById('card-num').innerText = user.card;
            
            // Обновление чата
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            user.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.from === this.currentUser ? 'mine' : ''}`;
                div.innerHTML = `<b>${m.from}:</b> ${m.text}`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;

            document.getElementById('my-inventory').innerText = "Твои подарки: " + (user.inventory.join(', ') || "пусто");
        },

        work() {
            const reward = 250;
            this.db.users[this.currentUser].balance += reward;
            alert(`🔨 Ты отработал смену в Aura-Corp! +${reward} 💎`);
            this.save();
            this.updateUI();
        },

        sendMoney() {
            const to = document.getElementById('transfer-to').value;
            const amt = parseInt(document.getElementById('transfer-amount').value);
            const user = this.db.users[this.currentUser];

            if (this.db.users[to] && amt <= user.balance && amt > 0) {
                user.balance -= amt;
                this.db.users[to].balance += amt;
                this.db.users[to].messages.push({from: "СИСТЕМА", text: `💳 Перевод от ${this.currentUser}: +${amt} 💎`});
                alert("Успешно отправлено!");
                this.save();
                this.updateUI();
            } else { alert("Ошибка перевода!"); }
        },

        buyGift(name, price) {
            const user = this.db.users[this.currentUser];
            if (user.balance >= price) {
                user.balance -= price;
                user.inventory.push(name);
                alert(`🎁 Подарок ${name} куплен!`);
                this.save();
                this.updateUI();
            } else { alert("Недостаточно 💎"); }
        },

        sendMessage() {
            const text = document.getElementById('chat-input').value;
            if (!text) return;
            const msg = { from: this.currentUser, text: text };
            
            // В этой версии мы отправляем сообщение всем юзерам (имитация общего чата)
            Object.keys(this.db.users).forEach(u => {
                this.db.users[u].messages.push(msg);
            });
            
            document.getElementById('chat-input').value = '';
            this.save();
            this.updateUI();
        }
    };
</script>
</body>
</html>
